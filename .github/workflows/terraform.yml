---
name: terraform

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fmt, init -lockfile=readonly, validate and tflint from the shared workflow
  validate:
    uses: chorrell/workflows/.github/workflows/terraform-validate.yml@v1
    with:
      lockfile-readonly: true

  # The only CI check the main ruleset requires, so jobs above can be renamed,
  # split, or added without touching the ruleset. Add every new job to needs.
  terraform-validation:
    name: Terraform Validation
    if: always()
    needs: [validate]
    runs-on: ubuntu-slim
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required job did not succeed (${result})"
              exit 1
            fi
          done
